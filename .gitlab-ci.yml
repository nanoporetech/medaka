
include:
    - project: "epi2melabs/ci-templates"
      file: "push-conda.yaml"
    - project: "epi2melabs/ci-templates"
      file: "push-github.yaml"
    - project: "epi2melabs/ci-templates"
      file: "snippets.yaml"

default:
    tags:
        - linux
        - small
        - standard
        - x86_64

image: ${UBUNTU_IMAGE}:24.04

stages:
    - test
    - build
    - release

# Install a particular Python and set PYTHON envvar for Makefile 
.install-pyenv: &install-pyenv |
    git clone https://github.com/pyenv/pyenv.git ~/.pyenv
    export PYENV_ROOT="$HOME/.pyenv"
    export PATH="$PYENV_ROOT/bin:$PATH"
    PYTHON_CONFIGURE_OPTS="--enable-shared" pyenv install ${PYENV_VERSION}
    export PYTHON=$(PYENV_VERSION=$PYENV_VERSION pyenv which python)

.preparetest: &preparetest
    before_script:
        - export DEBIAN_FRONTEND=noninteractive
        - apt-get update -qq
        - apt-get install -y -qq 
          gcc make cmake curl wget git
          zlib1g-dev libbz2-dev liblzma-dev libncurses-dev libcurl4-gnutls-dev
          libssl-dev libffi-dev valgrind
          libreadline8 libreadline-dev sqlite3 libsqlite3-dev
        - *install-pyenv


.minimal-python: &minimal-python
    before_script:
        - export DEBIAN_FRONTEND=noninteractive
        - apt-get update -qq && apt-get install -y -qq
          python3-all-dev python3-venv git


# Check that the changelog is up to date and other stuff
# do this is test 'cos no one wants to wait for all the
# wheels to build to find out they forgot to update the log
deploy-checks:
    stage: test
    script:
        - export LICENSE_FILE="ONT-LICENSE"
        - !reference [.check, python-version]
        - !reference [.check, changelog]
        - !reference [.check, license]
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+$/'



# medaka test suite on various Pythons, latest as of 2025-11-24
pytest: &pytest
    stage: test
    <<: *preparetest
    variables:
        MEDAKA_CPU: 1
    script:
        - make test
        - make test-consensus
        - make test-variants
    parallel:
        matrix:
            - PYENV_VERSION: 3.10.14
            - PYENV_VERSION: 3.11.9
            - PYENV_VERSION: 3.12.10
            - PYENV_VERSION: 3.13.9


test-mem-check:
    stage: test
    variables:
        PYENV_VERSION: 3.10.17
    <<: *preparetest
    script:
        - make mem_check


###
# Source distribution
#

build:sdist:
    stage: build
    <<: *preparetest
    variables:
        PYENV_VERSION: 3.10.14
    script:
        - make sdist
    artifacts:
        paths:
            - dist/*.tar.gz

###
# Many linux builds
#
.many-linux:
    stage: build
    image: ${MANYLINUX_IMAGE}:2_28
    variables:
        DO_COUNT_TEST: 1
        MEDAKA_CPU: 1
    script:
        - echo "Building a Python ${PYWHEEL} wheel on manylinux_${FLAVOUR}"
        - ./build-wheels.sh . ${PYWHEEL}
    artifacts:
        paths:
            - wheelhouse-final/*.whl

wheels-2_28:
    extends: .many-linux
    before_script: 
        - dnf install -y libffi-devel
    parallel:
        matrix:
            - PYWHEEL: [10, 11, 12, 13]
              COMPUTE: ["cpu"]
              FLAVOUR: ["2_28"]


wheels-arm-2_28:
    extends: .many-linux
    tags:
        - linux
        - small
        - standard
        - arm64
    parallel:
        matrix:
            - PYWHEEL: [10, 11, 12, 13]
              COMPUTE: ["cpu"]
              FLAVOUR: ["2_28"]


###
# macOS wheels, note we don't take special care of macOS runtime version
#

.mac-wheel:
    stage: build
    script:
        - echo "Building a wheel on macOS"
        - arch; echo ""
        - clang --version
        - gcc --version
        - python3 -m venv pypi_build --prompt "pypi"
        - . ./pypi_build/bin/activate
        - pip install cibuildwheel
        - make scripts/mini_align
        - CIBW_BUILD=cp3${PYWHEEL}-macosx_${arch} MACOSX_DEPLOYMENT_TARGET=12 CIBW_ENVIRONMENT="MEDAKA_LINK_ARGS='-L/opt/homebrew/lib' MEDAKA_DIST=1" cibuildwheel --output-dir wheelhouse-final
    artifacts:
        paths:
            - wheelhouse-final/*.whl
    parallel:
        matrix:
            # 8 gives grief with wanted to add -mtune=haswell \:D/
            # suggests platform.machine() isn't reported correctly
            - PYWHEEL: [10, 11, 12, 13]


macOS-arm64-wheel:
    extends: .mac-wheel
    variables:
        arch: arm64
    tags:
        - macos
        - oxford
        - arm
        - shell


# macOS-x64-wheel:
# there's no pytorch macOS x64 wheels, so we don't build them


# Build conda packages but don't publish them
.before-conda: &before-conda |
    export CONDA_PKG=${CI_PROJECT_NAME}
    export CONDA_PKG_VERSION="dev"
    cd conda

conda:
    extends: .deploy-conda
    stage: build
    variables:
        UPLOAD: "no"
        USE_ORG_CHANNEL: "yes"
    before_script:
        - *before-conda
    rules:
        - if: $CI_COMMIT_TAG =~ /^v[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+$/
          when: never
        - if: $CI_PIPELINE_SOURCE == "push"

conda-arm:
    extends: .deploy-conda-linux-arm
    stage: build
    variables:
        UPLOAD: "no"
        USE_ORG_CHANNEL: "yes"
    before_script:
        - *before-conda
    rules:
        - if: $CI_COMMIT_TAG =~ /^v[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+$/
          when: never
        - if: $CI_PIPELINE_SOURCE == "push"

conda-mac-arm:
    extends: .deploy-conda-mac-arm
    stage: build
    variables:
        UPLOAD: "no"
        USE_ORG_CHANNEL: "yes"
    before_script:
        - *before-conda
    rules:
        - if: $CI_COMMIT_TAG =~ /^v[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+$/
          when: never
        - if: $CI_PIPELINE_SOURCE == "push"


###
# Deploy stages
#

# Send all tags to PyPI
push-pypi:
    stage: release
    <<: *minimal-python
    script:
        - make pypi_build/bin/activate
        - source pypi_build/bin/activate
        - twine upload dist/*.tar.gz wheelhouse-final/*.whl
    only:
        - tags
    artifacts:
        # just gathered together for easy inspection
        paths:
            - dist/*.tar.gz
            - wheelhouse-final/*.whl


# Mirrors rule in ci-templates/push-github.yaml but replaces user details
# and authorisation to skip OTP and use existing token
.github:
    setup-gh-repo:
        - git config --global user.email "research.git@nanoporetech.com"
        - git config --global user.name "ontresearch"
        - gh auth status  # check auth status

# Send all tags matching vX.Y.Z to github (code and release)
push-github:
    image: ${UBUNTU_IMAGE}:24.04  # if not set, resolves to 20.04 which is missing uv index
    variables:
        GH_NAMESPACE: "nanoporetech"
        GH_TOKEN: ${RESEARCH_BOT_GH_TOKEN}
        GITHUB_AUTH_SCOPES: ""
    

# Deploy to conda - need to rebuild because the template code
# is a one step build and push, for reasons...
# we override the rule so that we can push pre-release versions
.before-conda-tag: &before-conda-tag |
    export CONDA_PKG=${CI_PROJECT_NAME}
    export CONDA_PKG_VERSION=${CI_COMMIT_TAG/v/}
    cd conda

push-conda:
    extends: .deploy-conda
    variables:
        USE_ORG_CHANNEL: "yes"
    before_script:
        - *before-conda-tag
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(\S+)?$/'

push-conda-arm:
    extends: .deploy-conda-linux-arm
    variables:
        USE_ORG_CHANNEL: "yes"
    before_script:
        - *before-conda-tag
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(\S+)?$/'

push-conda-mac-arm:
    extends: .deploy-conda-mac-arm
    variables:
        USE_ORG_CHANNEL: "yes"
    before_script:
        - *before-conda-tag
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(\S+)?$/'
